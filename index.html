<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Kartun Kepala AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2d2b55);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Area Kepala Avatar */
    .avatar-wrapper {
      position: relative;
      width: 320px;
      height: 340px;
      margin-bottom: 25px;
      transition: transform 0.08s ease-out;
    }

    /* Elemen Wajah (SVG) */
    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.4));
    }

    /* Kedipan Mata */
    .eye {
      transform-origin: center;
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    /* Panel Kontrol & Izin */
    .controls {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px 30px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
    }

    button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
      margin-bottom: 12px;
    }

    button:hover {
      background: #a29bfe;
      transform: translateY(-2px);
    }

    .audio-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      margin-top: 8px;
    }

    .status {
      font-size: 14px;
      margin-bottom: 12px;
      color: #fab1a0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- SVG Avatar Kepala Kartun -->
    <div class="avatar-wrapper" id="avatarHead">
      <svg viewBox="0 0 200 220">
        <!-- Rambut Belakang -->
        <path d="M40 90 Q100 10 160 90" fill="#2d3436" />

        <!-- Kepala / Wajah -->
        <rect x="45" y="45" width="110" height="130" rx="55" fill="#ffdcb4" />

        <!-- Rambut Depan -->
        <path d="M45 75 Q100 30 155 75 Q130 50 100 55 Q70 50 45 75 Z" fill="#2d3436" />

        <!-- Alis -->
        <line x1="65" y1="80" x2="85" y2="80" stroke="#2d3436" stroke-width="4" stroke-linecap="round" />
        <line x1="115" y1="80" x2="135" y2="80" stroke="#2d3436" stroke-width="4" stroke-linecap="round" />

        <!-- Mata -->
        <g class="eye">
          <circle cx="75" cy="95" r="7" fill="#2d3436" />
          <circle cx="73" cy="93" r="2.5" fill="#fff" />
        </g>
        <g class="eye">
          <circle cx="125" cy="95" r="7" fill="#2d3436" />
          <circle cx="123" cy="93" r="2.5" fill="#fff" />
        </g>

        <!-- Hidung -->
        <path d="M100 105 L96 118 L104 118" stroke="#e0a97a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Mulut Dinamis (Buka/Tutup lewat JS) -->
        <ellipse id="mouth" cx="100" cy="142" rx="15" ry="3" fill="#d63031" stroke="#2d3436" stroke-width="2" />
        <path id="teeth" d="M88 140 Q100 143 112 140" stroke="#ffffff" stroke-width="3" fill="none" />
      </svg>
    </div>

    <!-- Panel Kontrol -->
    <div class="controls">
      <div class="status" id="statusText">Status: Belum ada izin mikrofon</div>
      <button id="btnStart">Izinkan & Mulai Mikrofon</button>

      <div class="audio-toggle">
        <label for="hearSelf">Dengarkan Suara Asli (Monitor):</label>
        <input type="checkbox" id="hearSelf" disabled>
      </div>
      <small style="color: #bbb; display:block; margin-top:5px; font-size:11px;">
        *Gunakan headset saat mengaktifkan monitor suara agar tidak feedback/dengung.
      </small>
    </div>
  </div>

  <script>
    const btnStart = document.getElementById('btnStart');
    const statusText = document.getElementById('statusText');
    const hearSelfCheckbox = document.getElementById('hearSelf');
    const mouth = document.getElementById('mouth');
    const avatarHead = document.getElementById('avatarHead');

    let audioContext;
    let analyser;
    let microphoneSource;
    let monitorNode;
    let isRunning = false;

    btnStart.addEventListener('click', async () => {
      if (isRunning) return;

      try {
        // 1. Meminta izin ke perangkat mikrofon
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        statusText.innerText = "Status: Mikrofon Aktif. Silakan bicara!";
        statusText.style.color = "#55efc4";
        btnStart.style.display = "none";
        hearSelfCheckbox.disabled = false;

        // 2. Inisialisasi Web Audio API
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        microphoneSource = audioContext.createMediaStreamSource(stream);
        microphoneSource.connect(analyser);

        // Pengaturan output suara asli
        monitorNode = audioContext.destination;
        hearSelfCheckbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            microphoneSource.connect(monitorNode); // Suara asli terdengar di speaker
          } else {
            microphoneSource.disconnect(monitorNode);
          }
        });

        isRunning = true;
        detectVoice();
      } catch (err) {
        console.error(err);
        statusText.innerText = "Gagal: Izin mikrofon ditolak / tidak ditemukan!";
        statusText.style.color = "#ff7675";
      }
    });

    // 3. Deteksi volume suara & animasi mulut serta postur kepala
    function detectVoice() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function renderFrame() {
        if (!isRunning) return;
        requestAnimationFrame(renderFrame);

        analyser.getByteFrequencyData(dataArray);

        // Hitung rata-rata volume suara
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
          sum += dataArray[i];
        }
        let averageVolume = sum / bufferLength;

        // Threshold (ambang batas suara bicara)
        const threshold = 10;

        if (averageVolume > threshold) {
          // Buka mulut sesuai kerasnya volume suara
          let mouthOpening = Math.min((averageVolume - threshold) * 0.45, 18);
          mouth.setAttribute("ry", 3 + mouthOpening);
          mouth.setAttribute("rx", 15 + mouthOpening * 0.3);

          // Gerakan postur kepala (mengangguk & sedikit miring saat bicara)
          let tilt = Math.sin(Date.now() / 100) * 4; 
          let nod = Math.min(averageVolume * 0.15, 8);
          avatarHead.style.transform = `translateY(${nod}px) rotate(${tilt}deg)`;
        } else {
          // Posisi diam (idle) saat tidak bersuara
          mouth.setAttribute("ry", 3);
          mouth.setAttribute("rx", 15);
          avatarHead.style.transform = `translateY(0px) rotate(0deg)`;
        }
      }

      renderFrame();
    }
  </script>
</body>
</html>
