<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Cartoon Virtual Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080d1b;
  font-family:Arial,sans-serif;
  color:white;
}

header{
  padding:20px;
  text-align:center;
  background:#111a30;
  border-bottom:1px solid #273653;
}

header h2{
  margin:0;
  color:#60a5fa;
}

header p{
  color:#94a3b8;
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.stage{
  position:relative;
  width:100%;
  height:540px;
  overflow:hidden;
  border-radius:18px;
  border:2px solid #334155;
  background:linear-gradient(145deg,#273c67,#0b1224);
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.badge{
  position:absolute;
  top:15px;
  left:15px;
  background:#0009;
  padding:10px 15px;
  border-radius:30px;
  font-size:12px;
}

.panel{
  background:#111a30;
  margin-top:15px;
  padding:20px;
  border-radius:16px;
}

button{
  padding:13px 17px;
  margin:5px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.green{
  background:#059669;
}

button.red{
  background:#dc2626;
}

button:hover{
  filter:brightness(1.15);
}

label{
  display:block;
  margin-top:16px;
  margin-bottom:8px;
  font-size:13px;
}

input[type=range]{
  width:100%;
  accent-color:#38bdf8;
}

.status{
  background:#050b18;
  color:#67e8f9;
  border-radius:10px;
  padding:13px;
  margin-top:15px;
  font-size:13px;
  line-height:1.6;
}

video{
  display:none;
}

@media(max-width:600px){
  .stage{
    height:460px;
  }

  button{
    padding:12px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🤖 AI CARTOON CAMERA</h2>
  <p>Kartun Cowok • Gerakan Halus • Suara Asli</p>
</header>

<div class="container">

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="badge" id="badge">⚪ CAMERA OFF</div>
  </div>

  <video id="video" autoplay muted playsinline></video>

  <div class="panel">

    <h3>📷 Kamera & Mikrofon</h3>

    <button class="green" onclick="startAll()">
      ▶ Aktifkan Kamera + Mikrofon
    </button>

    <button onclick="startMicOnly()">
      🎤 Mikrofon Saja
    </button>

    <button class="red" onclick="stopAll()">
      ⏹ Matikan
    </button>

    <button onclick="fullScreen()">
      ⛶ Layar Penuh
    </button>

    <h3>⚙️ Pengaturan Animasi</h3>

    <label>Kehalusan Gerakan</label>
    <input type="range" id="smooth" min="1" max="100" value="75">

    <label>Gerakan Kepala</label>
    <input type="range" id="headPower" min="0" max="100" value="80">

    <label>Gerakan Mulut</label>
    <input type="range" id="mouthPower" min="0" max="100" value="90">

    <label>Gerakan Badan</label>
    <input type="range" id="bodyPower" min="0" max="100" value="65">

    <div class="status" id="status">
      Kartun siap. Aktifkan kamera dan mikrofon.
    </div>

  </div>

</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const stage=document.getElementById("stage");
const video=document.getElementById("video");

const badge=document.getElementById("badge");
const statusBox=document.getElementById("status");

let W=900;
let H=540;

let faceLandmarker=null;

let cameraStream=null;
let micStream=null;

let audioContext=null;
let analyser=null;
let audioData=null;

let cameraActive=false;
let micActive=false;

let lastVideoTime=-1;
let requestId=0;

const target={
  x:0,
  y:0,
  tilt:0,
  yaw:0,
  mouth:0,
  blinkL:0,
  blinkR:0,
  smile:0
};

const current={...target};

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function status(text){
  statusBox.textContent=text;
}

function resize(){

  const rect=stage.getBoundingClientRect();

  const dpr=Math.min(devicePixelRatio||1,2);

  W=rect.width;
  H=rect.height;

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);

resize();

function roundRect(x,y,w,h,r,color){

  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function ellipse(x,y,rx,ry,color){

  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fill();
}

function path(points,color){

  ctx.fillStyle=color;
  ctx.beginPath();

  ctx.moveTo(points[0][0],points[0][1]);

  for(let i=1;i<points.length;i++){
    ctx.lineTo(points[i][0],points[i][1]);
  }

  ctx.closePath();
  ctx.fill();
}

function line(points,color,width=3){

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.beginPath();
  ctx.moveTo(points[0][0],points[0][1]);

  for(let i=1;i<points.length;i++){
    ctx.lineTo(points[i][0],points[i][1]);
  }

  ctx.stroke();
}

function drawEye(x,y,blink,lookX,lookY){

  const open=clamp(1-blink,0.04,1);

  ellipse(x,y,22,16*open,"#ffffff");

  if(open>0.2){

    ellipse(
      x+lookX,
      y+lookY,
      10,
      12*open,
      "#293548"
    );

    ellipse(
      x+lookX+3,
      y+lookY-4,
      3,
      4,
      "#ffffff"
    );

  }

  if(open<0.3){

    line(
      [[x-19,y],[x+19,y]],
      "#754638",
      3
    );

  }
}

function drawCharacter(time){

  const headPower=
    Number(document.getElementById("headPower").value)/100;

  const bodyPower=
    Number(document.getElementById("bodyPower").value)/100;

  const idle=Math.sin(time*1.7);

  const breathing=Math.sin(time*2.2);

  const cx=W/2;
  const cy=H*0.49;

  const scale=Math.min(W/600,H/500)*1.1;

  ctx.save();

  ctx.translate(cx,cy);
  ctx.scale(scale,scale);

  // Bayangan belakang

  ellipse(0,205,170,35,"#07102055");

  // Gerakan badan

  ctx.save();

  ctx.translate(
    current.x*10*bodyPower,
    breathing*3*bodyPower
  );

  ctx.rotate(
    current.tilt*0.15*bodyPower+
    idle*0.012*bodyPower
  );

  // Badan / jaket

  ellipse(0,205,170,150,"#172a48");

  path([
    [-140,145],
    [-95,102],
    [-46,83],
    [46,83],
    [95,102],
    [140,145],
    [162,270],
    [-162,270]
  ],"#2563eb");

  // Leher

  roundRect(-36,56,72,95,20,"#d99672");

  // Kaos

  path([
    [-45,110],
    [0,145],
    [45,110],
    [75,270],
    [-75,270]
  ],"#f1f5f9");

  // Jaket kiri

  path([
    [-45,110],
    [-92,103],
    [-115,155],
    [-55,270],
    [-10,270]
  ],"#1d4ed8");

  // Jaket kanan

  path([
    [45,110],
    [92,103],
    [115,155],
    [55,270],
    [10,270]
  ],"#1d4ed8");

  line(
    [[0,150],[0,270]],
    "#93c5fd",
    3
  );

  ctx.restore();

  // Kepala

  ctx.save();

  ctx.translate(
    current.x*20*headPower,
    current.y*16*headPower+
    idle*2
  );

  ctx.rotate(
    current.tilt*headPower+
    Math.sin(time*1.2)*0.012
  );

  ctx.scale(
    1-current.yaw*0.08,
    1
  );

  // Telinga

  ellipse(-91,0,18,31,"#e7ad88");
  ellipse(91,0,18,31,"#e7ad88");

  // Wajah

  ellipse(0,0,91,115,"#edb48d");

  // Bayangan pipi

  ellipse(-65,35,20,16,"#eaa27e");
  ellipse(65,35,20,16,"#eaa27e");

  // Rambut belakang

  ellipse(0,-85,99,63,"#182033");

  // Rambut bagian depan

  path([
    [-90,-76],
    [-78,-117],
    [-44,-139],
    [0,-145],
    [48,-133],
    [84,-111],
    [92,-75],
    [56,-92],
    [29,-106],
    [-7,-89],
    [-41,-96],
    [-72,-77]
  ],"#182033");

  // Jambul

  path([
    [-75,-104],
    [-24,-145],
    [37,-141],
    [13,-118],
    [-20,-110],
    [-46,-86]
  ],"#26334c");

  // Alis

  line(
    [[-63,-31],[-42,-39],[-21,-35]],
    "#342b2b",
    6
  );

  line(
    [[21,-35],[42,-39],[63,-31]],
    "#342b2b",
    6
  );

  // Mata

  const lookX=clamp(current.yaw*12,-8,8);
  const lookY=clamp(current.y*6,-5,5);

  drawEye(
    -43,
    -13,
    current.blinkL,
    lookX,
    lookY
  );

  drawEye(
    43,
    -13,
    current.blinkR,
    lookX,
    lookY
  );

  // Hidung

  line(
    [[0,-1],[-5,25],[5,28]],
    "#cc876a",
    3
  );

  // Mulut

  const mouth=clamp(current.mouth,0,1);

  if(mouth>0.08){

    ellipse(
      0,
      61,
      22+mouth*8,
      4+mouth*24,
      "#6c2938"
    );

    if(mouth>0.28){

      ellipse(
        0,
        52,
        17+mouth*5,
        4+mouth*5,
        "#fff5eb"
      );

    }

    if(mouth>0.5){

      ellipse(
        0,
        74,
        14,
        6,
        "#dc7181"
      );

    }

  }else{

    ctx.strokeStyle="#9d514c";
    ctx.lineWidth=3;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(-22,60);
    ctx.quadraticCurveTo(
      0,
      67+current.smile*8,
      22,
      60
    );

    ctx.stroke();
  }

  // Kilau rambut

  line(
    [[-42,-126],[-13,-135],[15,-132]],
    "#34415b",
    5
  );

  ctx.restore();

  ctx.restore();
}

function drawBackground(time){

  const gradient=ctx.createLinearGradient(
    0,0,W,H
  );

  gradient.addColorStop(0,"#243b68");
  gradient.addColorStop(1,"#091226");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<12;i++){

    const x=W*(i+0.5)/12;

    const y=
      H*0.35+
      Math.sin(time+i*0.7)*18;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      15+Math.sin(time+i)*5,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#60a5fa0a";
    ctx.fill();
  }
}

function draw(time){

  ctx.clearRect(0,0,W,H);

  drawBackground(time);

  drawCharacter(time);
}

function getScore(categories,name){

  const item=categories?.find(
    x=>x.categoryName===name
  );

  return item?.score||0;
}

function processFace(result){

  if(!result.faceLandmarks?.length)return;

  const points=result.faceLandmarks[0];

  const nose=points[1];
  const left=points[33];
  const right=points[263];

  const centerX=(left.x+right.x)/2;
  const centerY=(left.y+right.y)/2;

  target.x=clamp(
    (0.5-centerX)*2,
    -1,
    1
  );

  target.y=clamp(
    (centerY-0.45)*2,
    -1,
    1
  );

  target.tilt=clamp(
    -Math.atan2(
      right.y-left.y,
      right.x-left.x
    ),
    -0.45,
    0.45
  );

  const eyeDistance=Math.max(
    Math.hypot(
      right.x-left.x,
      right.y-left.y
    ),
    0.01
  );

  target.yaw=clamp(
    (nose.x-centerX)/eyeDistance,
    -0.8,
    0.8
  );

  const categories=
    result.faceBlendshapes?.[0]?.categories;

  target.mouth=getScore(
    categories,
    "jawOpen"
  );

  target.blinkL=getScore(
    categories,
    "eyeBlinkLeft"
  );

  target.blinkR=getScore(
    categories,
    "eyeBlinkRight"
  );

  target.smile=(
    getScore(categories,"mouthSmileLeft")+
    getScore(categories,"mouthSmileRight")
  )/2;
}

async function initFaceTracking(){

  if(faceLandmarker)return;

  status("⏳ Memuat AI pelacak wajah...");

  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  const options={
    baseOptions:{
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numFaces:1,
    outputFaceBlendshapes:true
  };

  try{

    faceLandmarker=
      await FaceLandmarker.createFromOptions(
        vision,
        options
      );

  }catch(error){

    options.baseOptions.delegate="CPU";

    faceLandmarker=
      await FaceLandmarker.createFromOptions(
        vision,
        options
      );
  }
}

async function startCamera(){

  if(cameraActive)return;

  const id=++requestId;

  try{

    cameraStream=
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },
        audio:false
      });

    if(id!==requestId){
      cameraStream.getTracks().forEach(
        t=>t.stop()
      );
      return;
    }

    video.srcObject=cameraStream;

    await video.play();

    cameraActive=true;

    badge.textContent="🟡 CAMERA ACTIVE";

    await initFaceTracking();

    if(id!==requestId)return;

    badge.textContent="🟢 FACE TRACKING";

    status(
      "✅ Kamera aktif.\n"+
      "Gerakkan kepala dan wajah kamu."
    );

  }catch(error){

    status(
      "❌ Kamera gagal: "+error.message+
      "\nGunakan HTTPS atau localhost."
    );

  }
}

async function startMic(){

  if(micActive)return;

  try{

    micStream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    audioContext=new (
      window.AudioContext||
      window.webkitAudioContext
    )();

    const source=
      audioContext.createMediaStreamSource(
        micStream
      );

    analyser=audioContext.createAnalyser();

    analyser.fftSize=1024;

    source.connect(analyser);

    audioData=new Uint8Array(
      analyser.fftSize
    );

    micActive=true;

    status(
      "🎤 Mikrofon aktif.\n"+
      "Bicara untuk menggerakkan mulut kartun."
    );

  }catch(error){

    status(
      "❌ Mikrofon gagal: "+error.message
    );

  }
}

function getVolume(){

  if(!analyser||!audioData)return 0;

  analyser.getByteTimeDomainData(audioData);

  let sum=0;

  for(const value of audioData){

    const x=(value-128)/128;

    sum+=x*x;
  }

  return clamp(
    Math.sqrt(sum/audioData.length)*9,
    0,
    1
  );
}

window.startAll=async function(){

  await startCamera();
  await startMic();

};

window.startMicOnly=async function(){

  await startMic();

};

window.stopAll=function(){

  requestId++;

  cameraActive=false;
  micActive=false;

  if(cameraStream){

    cameraStream.getTracks().forEach(
      t=>t.stop()
    );

    cameraStream=null;
  }

  if(micStream){

    micStream.getTracks().forEach(
      t=>t.stop()
    );

    micStream=null;
  }

  if(audioContext){

    audioContext.close();
    audioContext=null;
  }

  analyser=null;
  audioData=null;

  video.srcObject=null;

  for(const key in target){
    target[key]=0;
  }

  badge.textContent="⚪ CAMERA OFF";

  status("Kamera dan mikrofon dimatikan.");
};

window.fullScreen=function(){

  if(!document.fullscreenElement){
    stage.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
};

let lastTime=performance.now();

function animate(now){

  requestAnimationFrame(animate);

  const dt=Math.min(
    (now-lastTime)/1000,
    0.05
  );

  lastTime=now;

  if(
    cameraActive &&
    faceLandmarker &&
    video.readyState>=2 &&
    video.currentTime!==lastVideoTime
  ){

    lastVideoTime=video.currentTime;

    try{

      const result=
        faceLandmarker.detectForVideo(
          video,
          now
        );

      processFace(result);

    }catch(error){
      console.error(error);
    }
  }

  const smooth=
    Number(document.getElementById("smooth").value)/100;

  const speed=1-Math.exp(
    -(15-smooth*12)*dt
  );

  const volume=getVolume();

  const mouthPower=
    Number(document.getElementById("mouthPower").value)/100;

  for(const key in current){

    let destination=target[key];

    if(key==="mouth"){

      destination=Math.max(
        target.mouth,
        volume*0.9
      )*mouthPower;
    }

    current[key]=lerp(
      current[key],
      destination,
      key.startsWith("blink")
        ?Math.max(speed,0.4)
        :speed
    );
  }

  // Kedipan alami saat kamera tidak aktif

  if(!cameraActive){

    const t=now/1000;

    const blink=
      Math.pow(
        Math.max(
          0,
          Math.sin(t*1.7)
        ),
        35
      );

    current.blinkL=blink;
    current.blinkR=blink;
  }

  draw(now/1000);
}

requestAnimationFrame(animate);

window.addEventListener("beforeunload",()=>{

  if(cameraStream){
    cameraStream.getTracks().forEach(
      t=>t.stop()
    );
  }

  if(micStream){
    micStream.getTracks().forEach(
      t=>t.stop()
    );
  }

});

</script>

</body>
</html>
