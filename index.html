<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Head Card - Voice Reactive</title>
  <!-- Three.js untuk Render Kepala 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, monospace, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Modal Awal untuk memicu Pop-up Asli Chrome */
    #promptOverlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      text-align: center;
    }

    .prompt-box {
      background: #0f172a;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 30px;
      max-width: 440px;
      width: 100%;
    }

    .btn-chrome {
      margin-top: 20px;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
    }

    .btn-chrome:hover {
      background: #38bdf8;
      color: #020617;
    }

    /* KARTU AI HANYA KEPALA */
    .card-container {
      perspective: 1000px;
    }

    .ai-card {
      width: 360px;
      height: 520px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      position: relative;
      overflow: hidden;
    }

    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: #38bdf8;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 10px;
    }

    /* Area 3D Kepala */
    #canvas3d {
      width: 100%;
      height: 330px;
      border-radius: 12px;
      margin: 10px 0;
    }

    /* Kontrol Audio di Dalam Kartu */
    .card-footer {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .wave-bar-wrap {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .wave-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.05s ease;
    }
  </style>
</head>
<body>

  <!-- Layar Pemicu Izin Chrome -->
  <div id="promptOverlay">
    <div class="prompt-box">
      <h3 style="color:#38bdf8; margin-bottom: 10px;">Izin Mikrofon Chrome</h3>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
        Klik tombol di bawah untuk menampilkan <b>popup perizinan resmi dari Google Chrome</b> (di pojok kiri atas browser).
      </p>
      <button class="btn-chrome" id="btnRequest">Minta Izin ke Chrome</button>
      <p id="errorNote" style="color:#f87171; font-size: 12px; margin-top: 10px; display: none;"></p>
    </div>
  </div>

  <!-- KARTU AI (HANYA KEPALA 3D) -->
  <div class="card-container">
    <div class="ai-card">
      <div class="card-header">
        <span>CORE // AI HEAD</span>
        <span id="statusBadge" style="color: #f87171;">● STANDBY</span>
      </div>

      <!-- Wadah 3D Kepala -->
      <div id="canvas3d"></div>

      <!-- Kontrol & Suara Asli -->
      <div class="card-footer">
        <div class="toggle-wrap">
          <span>Dengarkan Suara Asli:</span>
          <input type="checkbox" id="micLoopback">
        </div>
        <div class="wave-bar-wrap">
          <div class="wave-bar" id="waveBar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btnRequest = document.getElementById('btnRequest');
    const promptOverlay = document.getElementById('promptOverlay');
    const statusBadge = document.getElementById('statusBadge');
    const waveBar = document.getElementById('waveBar');
    const micLoopback = document.getElementById('micLoopback');
    const errorNote = document.getElementById('errorNote');
    const canvasContainer = document.getElementById('canvas3d');

    let audioContext, analyser, micSource, monitorNode;
    let isListening = false;

    // --- 1. INISIALISASI SCENE 3D (KEPALA CYBER ROBOT) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    canvasContainer.appendChild(renderer.domElement);

    // Pencahayaan
    const light1 = new THREE.DirectionalLight(0x38bdf8, 1.8);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x818cf8, 1.2);
    light2.position.set(-5, -5, -2);
    scene.add(light2);

    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
    scene.add(ambientLight);

    // Grup Utama Kepala
    const headGroup = new THREE.Group();
    scene.add(headGroup);

    // Tempurung Kepala (Cranium)
    const craniumGeo = new THREE.SphereGeometry(1.2, 32, 32);
    const cyberMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      metalness: 0.85,
      roughness: 0.25,
      wireframe: false
    });
    const cranium = new THREE.Mesh(craniumGeo, cyberMat);
    cranium.scale.set(1, 1.15, 1);
    headGroup.add(cranium);

    // Visor Mata Glowing
    const visorGeo = new THREE.BoxGeometry(1.4, 0.3, 0.8);
    const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 0.2, 0.85);
    headGroup.add(visor);

    // Rahang Bawah / Mulut (Bisa Bergerak Turun Saat Bersuara)
    const jawGeo = new THREE.BoxGeometry(1.1, 0.5, 1.1);
    const jaw = new THREE.Mesh(jawGeo, cyberMat);
    jaw.position.set(0, -0.9, 0.2);
    headGroup.add(jaw);

    // Cincin Hologram Melayang di Kepala
    const ringGeo = new THREE.TorusGeometry(1.8, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
    const haloRing = new THREE.Mesh(ringGeo, ringMat);
    haloRing.rotation.x = Math.PI / 2;
    headGroup.add(haloRing);

    camera.position.z = 4.8;

    // --- 2. PEMICU IZIN RESMI CHROME (NATIVE POPUP) ---
    btnRequest.addEventListener('click', async () => {
      try {
        // Pemanggilan ini memunculkan popup asli Chrome di pojok kiri atas
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        // Jika user klik "Allow / Izinkan" di popup Chrome:
        promptOverlay.style.display = 'none';
        statusBadge.innerText = '● LIVE REACTIVE';
        statusBadge.style.color = '#38bdf8';

        initAudioEngine(stream);
      } catch (err) {
        console.error(err);
        errorNote.style.display = 'block';
        if (location.protocol === 'file:') {
          errorNote.innerHTML = "<b>PENTING:</b> Google Chrome memblokir popup mikrofon jika dibuka lewat file biasa (file:///). Jalankan lewat server lokal (seperti Live Server di VS Code).";
        } else {
          errorNote.innerText = "Izin ditolak pada dialog Chrome. Klik ikon gembok/setelan di sebelah URL Chrome untuk mengizinkan.";
        }
      }
    });

    // --- 3. PEMROSESAN AUDIO & SUARA ASLI ---
    function initAudioEngine(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      micSource = audioContext.createMediaStreamSource(stream);
      micSource.connect(analyser);

      // Fitur Suara Asli (Loopback ke Speaker)
      monitorNode = audioContext.destination;
      micLoopback.addEventListener('change', (e) => {
        if (e.target.checked) {
          micSource.connect(monitorNode);
        } else {
          micSource.disconnect(monitorNode);
        }
      });

      isListening = true;
    }

    // --- 4. RENDER LOOP (ANIMASI POSTUR KEPALA & MULUT) ---
    const dataArray = new Uint8Array(128);

    function animate() {
      requestAnimationFrame(animate);

      let volume = 0;
      if (isListening) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        volume = sum / dataArray.length;

        // Update indikator bar suara
        waveBar.style.width = Math.min(volume * 2.5, 100) + '%';
      }

      // Animasi Kepala Melayang (Idle Motion)
      const time = Date.now() * 0.002;
      haloRing.rotation.z += 0.01;

      if (volume > 12) {
        // JIKA BICARA:
        // 1. Rahang membuka sesuai desibel suara
        const mouthOpen = Math.min((volume - 12) * 0.02, 0.45);
        jaw.position.y = -0.9 - mouthOpen;

        // 2. Postur kepala mengangguk & miring dinamis
        headGroup.rotation.x = Math.sin(time * 4) * 0.15 + (volume * 0.005);
        headGroup.rotation.y = Math.cos(time * 3) * 0.2;
        headGroup.rotation.z = Math.sin(time * 2) * 0.05;
        headGroup.position.y = Math.sin(time * 5) * 0.1;
      } else {
        // JIKA DIAM:
        jaw.position.y = -0.9; // Mulut menutup
        headGroup.rotation.x = Math.sin(time) * 0.05;
        headGroup.rotation.y = Math.cos(time * 0.8) * 0.08;
        headGroup.rotation.z = 0;
        headGroup.position.y = Math.sin(time * 1.5) * 0.05;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsif jika ukuran window berubah
    window.addEventListener('resize', () => {
      camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    });
  </script>
</body>
</html>
